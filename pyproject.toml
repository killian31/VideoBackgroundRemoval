[project]
name = "vbr"
version = "2.0.0"
description = "Automatic background removal from an input video and a single user subject selection."
authors = [
    {name = "killian31", email = "80256683+killian31@users.noreply.github.com"}
]
license = {text = "Apache 2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.14",
    "torchvision>=0.29",
    "transformers>=5.20",
    "timm>=1.0",
    "opencv-python-headless>=5.0",
    "numpy>=2.0",
    "fastapi>=0.160",
    "uvicorn>=0.54",
    "python-multipart>=0.0.30",
    "imageio-ffmpeg>=0.6",
]
